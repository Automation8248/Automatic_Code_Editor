name: 🖼️ Auto Fetch & Save Images

on:
  workflow_dispatch: # Button se run karne ke liye
  schedule:
    - cron: '0 0 * * *' # Daily at 12:00 AM UTC run hoga

jobs:
  download-and-save-images:
    runs-on: ubuntu-latest
    # Timeout 4 hours ka set kiya hai taaki agar API time le, toh Github Action fail na ho
    timeout-minutes: 240 

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Required Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests PyGithub

      - name: 🚀 Run Image Fetcher Engine
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} 
        run: python fetch_images.py
