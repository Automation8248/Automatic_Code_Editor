name: Windows Master AI Server (HF Python + Live Chat + Record)

on:
  workflow_dispatch:
    inputs:
      record_screen:
        description: 'Screen Recording ON/OFF'
        required: true
        type: boolean
        default: false
      live_chat:
        description: 'Live Chat (AI के साथ खुद बात करने के लिए ON करें)'
        required: true
        type: boolean
        default: false
      prompt:
        description: 'AI के लिए प्रॉम्प्ट/कमांड'
        required: false
        type: string
        default: 'Hello, please confirm you are working.'

  repository_dispatch:
    types: [run-cross-repo-ai]

jobs:
  run-master-ai:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Libraries
        run: pip install huggingface_hub requests

      # ----- 1. SCREEN RECORDING -----
      - name: Start Screen Recording (If ON)
        if: ${{ github.event.inputs.record_screen == 'true' || github.event.client_payload.record_screen == 'true' }}
        run: |
          echo "Installing FFmpeg for Screen Recording..."
          choco install ffmpeg -y
          Start-Process -NoNewWindow -FilePath "ffmpeg" -ArgumentList "-f gdigrab -framerate 15 -i desktop -c:v libx264 -preset ultrafast screen_record.mp4"

      # ----- 2. HUGGING FACE PYTHON DOWNLOAD -----
      - name: Download Files via Python Script
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Running Python download script from scripts folder..."
          python scripts/download_hf.py

      # ----- 3. BAT FILE CREATION & EXECUTION (EXACT FILE NAME) -----
      - name: Create and Run start.bat
        run: |
          echo ".\llamafile-0.10.6.exe --server --model qwen3-4b-thinking-2507.Q4_K_M.gguf --host 0.0.0.0 --port 8080 --nobrowser" > start.bat
          
          echo "Starting Local AI Server..."
          Start-Process -FilePath "start.bat" -NoNewWindow
          
          echo "Waiting 45 seconds for AI to load into RAM..."
          Start-Sleep -Seconds 45 

      # ----- 4. LIVE CHAT (MAGIC TUNNEL) -----
      - name: Create Live Chat Link (If ON)
        if: ${{ github.event.inputs.live_chat == 'true' }}
        run: |
          echo "Installing Cloudflare Tunnel..."
          choco install cloudflared -y
          
          Start-Process -NoNewWindow -FilePath "cloudflared" -ArgumentList "tunnel --url http://127.0.0.1:8080" -RedirectStandardError "tunnel_log.txt"
          Start-Sleep -Seconds 10
          
          echo "========================================================="
          echo "🟢 आपका LIVE CHAT लिंक तैयार है (ChatGPT जैसा UI):"
          Select-String -Path tunnel_log.txt -Pattern "https://.*\.trycloudflare\.com" | Select-Object -First 1
          echo "========================================================="
          echo "आप इस लिंक पर क्लिक करके AI से बात कर सकते हैं। सर्वर 1 घंटे तक चालू रहेगा।"
          
          Start-Sleep -Seconds 3600

      # ----- 5. AUTOMATION QUERY (Run only if Live Chat is OFF) -----
      - name: Query AI For Automation
        if: ${{ github.event.inputs.live_chat != 'true' }}
        run: |
          python scripts/query_ai.py "${{ github.event.inputs.prompt || github.event.client_payload.prompt }}"

      # ----- 6. STOP RECORDING & SAVE -----
      - name: Stop Screen Recording
        if: always() 
        run: |
          taskkill /IM ffmpeg.exe /F || echo "Recording was OFF or already stopped."
          Start-Sleep -Seconds 5

      # ----- 7. UPLOAD ARTIFACTS -----
      - name: Upload Video Artifact
        if: ${{ github.event.inputs.record_screen == 'true' || github.event.client_payload.record_screen == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: AI-Session-Record
          path: screen_record.mp4

      - name: Upload AI Response Text
        if: ${{ github.event.inputs.live_chat != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: AI-Final-Output
          path: ai_output.txt
